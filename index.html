<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funk Land</title>

<!-- ⭐ Forward فوری -->
<meta http-equiv="refresh" content="0; url=https://imparsa-0913.github.io/funkland">
<link rel="canonical" href="https://imparsa-0913.github.io/funkland">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background: radial-gradient(circle at 50% 50%, #2a0050 0%, #0a0014 70%);
    color:#b366ff;
    font-family: Tahoma, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }
  .box { max-width: 500px; }
  .spinner {
    width: 60px; height: 60px;
    border: 4px solid rgba(179,102,255,.2);
    border-top-color: #b366ff;
    border-radius: 50%;
    animation: spin .9s linear infinite;
    box-shadow: 0 0 30px #8a2be2;
    margin: 0 auto 25px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 15px;
    text-shadow: 0 0 20px #8a2be2;
  }
  p {
    color: #b366ff;
    line-height: 1.8;
    margin-bottom: 25px;
    opacity: 0.8;
  }
  a {
    display: inline-block;
    padding: 12px 35px;
    background: linear-gradient(135deg, #8a2be2, #b366ff);
    color: #fff;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 0 0 30px #8a2be2;
    transition: transform .2s;
  }
  a:hover { transform: scale(1.05); }
</style>

<script>
  // Forward فوری با JS (سریع‌تر از meta refresh)
  window.location.replace("https://imparsa-0913.github.io/funkland");
</script>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>🎧 در حال انتقال به Funk Land...</h1>
    <p>اگه خودکار منتقل نشدی، روی دکمه زیر بزن</p>
    <a href="https://imparsa-0913.github.io/funkland">ورود به فانک لند 💜</a>
  </div>
</body>
</html>
